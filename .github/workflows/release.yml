name: Release AppImages

# Builds two self-contained AppImages from the release's tag and attaches both
# to that release's assets:
#
#   SLPM_${version}-x86_64.AppImage           the web dashboard (browser UI)
#   SLPM-Desktop_${version}-x86_64.AppImage   the dashboard in a native window
#
# Both bundle Python itself (python-build-standalone), so the web image does
# not depend on the interpreter or Python packages the target distribution
# ships. The desktop image paints with the host's WebKitGTK through
# python3-pywebview (bundled here as a pure-Python package) and runs on the
# host's python3: the WebKitGTK bindings are compiled per-ABI, so the glue
# interpreter must be the host's; the fallback is the browser. Also runnable
# manually (workflow_dispatch) for test builds; a manual run builds and
# smoke-tests the same files but uploads them as workflow artifacts instead of
# touching a release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned so a build is reproducible. A newer release usually raises the
  # glibc floor; bump deliberately, then re-check the container tests below
  # against the oldest distribution you want to support.
  PSA_RELEASE: "20250918"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            tag="$RELEASE_TAG"
          else
            tag="v0.2.0"
          fi
          version="${tag#v}"
          # The AppImage file names are SLPM_<version>-x86_64.AppImage and
          # SLPM-Desktop_<version>-x86_64.AppImage, so the name must match the
          # tag exactly: <version> is the tag with a single leading "v"
          # stripped, nothing else. The regex constrains the version's shape
          # and the check below pins it to the tag, so any tag whose stripped
          # form is not a plain, matching version (release-1.0, vv1.2, …) is
          # rejected rather than shipped.
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*([~+.-][0-9A-Za-z.]+)?$ ]] \
             || { [ "$tag" != "$version" ] && [ "$tag" != "v$version" ]; }; then
            echo "::error::Tag '$tag' is not a valid version (expected e.g. v1.2.3)."
            exit 1
          fi
          echo "AppImages will be named SLPM_${version}-x86_64.AppImage" \
               "and SLPM-Desktop_${version}-x86_64.AppImage"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          # rsvg-convert renders the app icon into the PNG raster menus expect.
          sudo apt-get install -y -qq librsvg2-bin

      - name: Resolve bundled Python download URL
        id: psa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url=$(gh api "repos/astral-sh/python-build-standalone/releases/tags/$PSA_RELEASE" \
            --jq '.assets[]
                  | select(.name | test("^cpython-3[.]12[.][0-9]+[+][0-9]+-x86_64-unknown-linux-gnu-install_only[.]tar[.]gz$"))
                  | .browser_download_url' \
            | head -n1)
          if [ -z "$url" ]; then
            echo "::error::No cpython-3.12 x86_64 install_only asset in PSA release $PSA_RELEASE."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Assemble web dashboard AppDir
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PSA_URL: ${{ steps.psa.outputs.url }}
        run: |
          set -euo pipefail
          AppDir="$PWD/SLPM.AppDir"

          # Bundled interpreter under a standard /usr prefix, so sys.prefix,
          # the stdlib and pip-installed packages all resolve inside the image.
          mkdir -p "$AppDir/usr" "$AppDir/usr/lib/slpm"
          curl -fsSL "$PSA_URL" -o /tmp/python.tar.gz
          tar -xzf /tmp/python.tar.gz -C "$AppDir/usr" --strip-components=1

          # Application dependencies and a CA bundle the interpreter can rely
          # on regardless of the host distribution's certificate layout.
          "$AppDir/usr/bin/python3" -m pip install --no-cache-dir \
            "flask>=3.1,<4.0" "waitress>=2.1,<4.0" certifi
          # AppImage tooling refuses its own build output if the tree carries
          # world-writable bits or stale bytecode caches.
          find "$AppDir" -type d -name __pycache__ -prune -exec rm -rf {} +

          cp app.py "$AppDir/usr/lib/slpm/"
          cp -r slpm templates static "$AppDir/usr/lib/slpm/"
          find "$AppDir/usr/lib/slpm" -type d -name __pycache__ -prune \
            -exec rm -rf {} +

          install -D -m 644 appimage/slpm.metainfo.xml \
            "$AppDir/usr/share/metainfo/io.github.parsasafaie.SLPM.metainfo.xml"
          install -D -m 644 LICENSE "$AppDir/usr/share/doc/slpm/LICENSE"

          # AppImage metadata at the AppDir root: the runtime and appimagetool
          # both read them from here (Exec= is rewritten to the real path).
          install -m 644 appimage/slpm.desktop "$AppDir/slpm.desktop"
          install -m 755 appimage/AppRun "$AppDir/AppRun"
          rsvg-convert -w 256 -h 256 appimage/slpm.svg -o "$AppDir/slpm.png"
          chmod 644 "$AppDir/slpm.png"
          ln -sf slpm.png "$AppDir/.DirIcon"

      - name: Assemble desktop AppDir
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          AppDir="$PWD/SLPM-Desktop.AppDir"

          # No bundled interpreter for this image (see appimage/AppRun-desktop
          # for why: gi must match the host Python's ABI). The pure-Python
          # pieces the window runs on travel with the image instead.
          mkdir -p "$AppDir/usr/lib/slpm" "$AppDir/usr/lib/python3"
          python3 -m pip install --no-cache-dir --no-compile \
            --target "$AppDir/usr/lib/python3" \
            "flask>=3.1,<4.0" "waitress>=2.1,<4.0" "pywebview>=4.0"
          # MarkupSafe ships optional C speedups compiled for the runner's
          # Python; they would fail to load on hosts with a different Python.
          # Its own import falls back to pure Python, so strip the compiled
          # extension and force exactly that path everywhere.
          find "$AppDir/usr/lib/python3" -name '_speedups*.so' -delete

          # Files must land in the image executable regardless of the mode the
          # checkout gave them (CI checks out 644; the packaging must not
          # depend on it). AppRun-desktop runs them via python3, but the image
          # is the contract - keep every shipped script executable.
          install -m 755 app.py "$AppDir/usr/lib/slpm/app.py"
          install -m 755 desktop_app.py "$AppDir/usr/lib/slpm/desktop_app.py"
          cp -r slpm templates static "$AppDir/usr/lib/slpm/"
          find "$AppDir/usr/lib/slpm" -type d -name __pycache__ -prune \
            -exec rm -rf {} +

          install -D -m 644 appimage/slpm-desktop.metainfo.xml \
            "$AppDir/usr/share/metainfo/io.github.parsasafaie.SLPM.Desktop.metainfo.xml"
          install -D -m 644 LICENSE \
            "$AppDir/usr/share/doc/slpm-desktop/LICENSE"

          install -m 644 appimage/slpm-desktop.desktop \
            "$AppDir/slpm-desktop.desktop"
          install -m 755 appimage/AppRun-desktop "$AppDir/AppRun"
          rsvg-convert -w 256 -h 256 appimage/slpm.svg -o "$AppDir/slpm.png"
          chmod 644 "$AppDir/slpm.png"
          ln -sf slpm.png "$AppDir/.DirIcon"

      - name: Build both AppImages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          # --appimage-extract-and-run: the runner has no FUSE. ARCH is
          # explicit for the desktop image: with no bundled native binary to
          # read, appimagetool cannot guess the architecture itself.
          ./appimagetool --appimage-extract-and-run SLPM.AppDir \
            "SLPM_${VERSION}-x86_64.AppImage"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            SLPM-Desktop.AppDir "SLPM-Desktop_${VERSION}-x86_64.AppImage"

      - name: Smoke test the web image in clean containers
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Four general-purpose floors the web image must work on as
          # downloaded, with no system Python involved. The oldest container
          # exercises the glibc the bundled interpreter actually needs; the
          # run must come from the extracted image, the auxiliary endpoints
          # must answer, and a TLS download through SLPM's own API proves the
          # CA bundle travelled with the interpreter.
          for image in ubuntu:22.04 debian:12 ubuntu:24.04 ubuntu:26.04; do
            echo "===== $image"
            docker run --rm -i -e VERSION="$VERSION" -v "$PWD:/pkg" -w /pkg \
              "$image" /bin/bash <<'SCRIPT'
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends curl ca-certificates

              appimage="SLPM_${VERSION}-x86_64.AppImage"
              test -f "$appimage"
              # --appimage-extract-and-run stands in for FUSE, unavailable in
              # containers; the same AppRun runs in both modes. AppRun keeps
              # the server in its foreground, so it runs in the background of
              # this script and is taken down by the server kill at the end.
              # </dev/null: bash is reading this very script from stdin, so
              # the backgrounded image must not inherit it and race for the
              # remaining lines.
              "./$appimage" --appimage-extract-and-run </dev/null &
              launcher=$!

              ok=""
              for _ in $(seq 1 30); do
                sleep 0.5
                if curl -sf http://127.0.0.1:8686/api/status | grep -q '"ok"'; then
                  ok=1; break
                fi
              done
              test -n "$ok"

              # The server process is the bundled interpreter running the
              # installed app — not the container's own Python (the extract
              # directory name differs between AppImageKit versions, so the
              # command line, not the path prefix, is what is checked).
              pid=$(cat "$HOME/.cache/slpm/server.pid")
              cmdline=$(tr '\0' ' ' < "/proc/$pid/cmdline")
              echo "$cmdline" | grep -qE '(appimage_extracted_[0-9a-f]+|squashfs-root)/usr/lib/slpm/app\.py'

              # A foreign Host header must be refused (the DNS-rebinding guard).
              ! curl -sf -o /dev/null -H "Host: evil.example" \
                     http://127.0.0.1:8686/api/status

              # Pages must render from inside the image: templates load
              # lazily, so a broken extraction would pass the API checks and
              # still fail here.
              curl -sf http://127.0.0.1:8686/ | grep -q '<!doctype html>'

              # Download over TLS through SLPM's own API: the bundled CA
              # bundle must work without any host-installed Python.
              curl -fsS -X POST -H 'Content-Type: application/json' \
                http://127.0.0.1:8686/api/download/start \
                -d '{"url": "https://www.python.org/robots.txt"}' \
                | grep -q '"ok": *true'
              dl=""
              for _ in $(seq 1 20); do
                sleep 0.5
                if curl -sf http://127.0.0.1:8686/api/downloads | grep -q '"state": *"done"'; then
                  dl=1; break
                fi
              done
              test -n "$dl"
              test -s "$HOME/Downloads/robots.txt"

              # Stopping the server ends the launcher and, with it, the image.
              kill "$pid"
              for _ in $(seq 1 20); do
                kill -0 "$launcher" 2>/dev/null || break
                sleep 0.5
              done
              ! kill -0 "$launcher" 2>/dev/null
          SCRIPT
          done

      - name: Smoke test the desktop image in clean containers
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The desktop image's floors are the host python3 and WebKitGTK 4.1,
          # resolved by APT below as the target machine would. No real window
          # can run without a display, so the server side runs headless (the
          # window itself was exercised on a real desktop) and the GTK
          # binding chain is proven importable under the same interpreter and
          # bundled PYTHONPATH the image runs with.
          for image in ubuntu:24.04 ubuntu:26.04 debian:13; do
            echo "===== $image"
            docker run --rm -i -e VERSION="$VERSION" -v "$PWD:/pkg" -w /tmp \
              "$image" /bin/bash <<'SCRIPT'
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends curl \
                ca-certificates python3 python3-gi procps \
                gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0

              appimage="/pkg/SLPM-Desktop_${VERSION}-x86_64.AppImage"
              test -f "$appimage"
              # Exercise the runtime's exec path without a GUI claim first.
              "$appimage" --appimage-extract-and-run --help \
                </dev/null 2>/dev/null | grep -q 'SLPM'
              # Extract deterministically: --appimage-extract always emits
              # ./squashfs-root in the CWD, while the extracted-and-run mode
              # creates — and deletes — a temp dir whose location varies with
              # TMPDIR, so file assertions must never depend on it.
              "$appimage" --appimage-extract >/dev/null
              root=/tmp/squashfs-root
              test -x "$root/usr/lib/slpm/desktop_app.py"
              test -f "$root/usr/lib/slpm/app.py"
              # The pywebview distribution installs its package as 'webview'.
              test -d "$root/usr/lib/python3/webview"
              test -d "$root/usr/lib/python3/flask"
              test -d "$root/usr/lib/python3/waitress"

              # The bundled pure-Python deps import under the HOST python,
              # and the WebKitGTK binding chain is complete on this floor.
              python3 -c "import sys; sys.path.insert(0, '$root/usr/lib/python3'); \
                import flask, waitress, webview, gi; \
                gi.require_version('WebKit2', '4.1'); \
                from gi.repository import WebKit2; print('package chain ok')"

              "$root/AppRun" --serve-only </dev/null &
              launcher=$!
              ok=""
              for _ in $(seq 1 30); do
                sleep 0.5
                if curl -sf http://127.0.0.1:8686/api/status | grep -q '"ok"'; then
                  ok=1; break
                fi
              done
              test -n "$ok"

              # The server glue runs under the host interpreter, not a
              # bundled one, and pages render from the installed files.
              cmdline=$(tr '\0' ' ' < "/proc/$(pgrep -f 'python.*desktop_app\.py' | head -1)/cmdline")
              echo "$cmdline" | grep -q "python.*desktop_app\.py"
              echo "$cmdline" | grep -qv "squashfs-root/usr/bin/python"
              curl -sf http://127.0.0.1:8686/ | grep -q '<!doctype html>'

              kill "$(pgrep -f 'python.*desktop_app\.py' | head -1)"
              for _ in $(seq 1 20); do
                kill -0 "$launcher" 2>/dev/null || break
                sleep 0.5
              done
              ! kill -0 "$launcher" 2>/dev/null
          SCRIPT
          done

      - name: Upload to release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "SLPM_${VERSION}-x86_64.AppImage" \
            "SLPM-Desktop_${VERSION}-x86_64.AppImage" --clobber

      - name: Upload build artifacts (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: "SLPM_AppImages_${{ steps.version.outputs.version }}"
          path: |
            SLPM_${{ steps.version.outputs.version }}-x86_64.AppImage
            SLPM-Desktop_${{ steps.version.outputs.version }}-x86_64.AppImage
